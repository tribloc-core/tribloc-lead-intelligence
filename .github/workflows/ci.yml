name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Check that every tracked JSON file parses
        run: |
          git ls-files -z -- '*.json' | xargs -0 node -e '
            const fs = require("fs");
            let bad = 0;
            for (const f of process.argv.slice(1)) {
              try { JSON.parse(fs.readFileSync(f, "utf8")); console.log("ok   " + f); }
              catch (e) { bad++; console.log("FAIL " + f + ": " + e.message); }
            }
            process.exit(bad ? 1 : 0);
          '

      - name: Run tests (no network; the MCP tests use a local mock server)
        run: node --test tests/*.test.mjs
